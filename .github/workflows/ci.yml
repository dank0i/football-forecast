name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      # The integration tests need the 313 MB database and are skipped here;
      # the unit suite, including every leakage test, runs on the synthetic
      # fixture and needs no download.
      - name: Test
        run: uv run pytest -q -m "not integration"
